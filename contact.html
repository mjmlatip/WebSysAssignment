<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="site-header">
        <nav class="navbar">
            <a class="logo" href="index.html">Blue<span>Horizon</span></a>

            <div class="nav-links" id="navLinks">
                <a href="index.html">Home</a>
                <a href="about.html">About Us</a>
                <a class="active" href="contact.html">Contact Us</a>
                <a href="login.html" class="nav-login">Login</a>
            </div>

        </nav>
    </header>

    <main>
        <section class="page-banner">
            <p class="label">Say hello</p>
            <h1>Contact Us</h1>
            <p>Have a question? We would love to hear from you.</p>
        </section>

        <section class="section contact-layout">

            <div class="contact-details">
                <p class="label">Find us</p>
                <h2>Lets talk about the ocean.</h2>
                <p>Send us a message about marine life things.</p>
                <p><b>Email:</b> websys@addu.edu.ph</p>
                <p><b>Phone:</b> +639 123 4567</p>
                <p><b>Location:</b> Philippines, Davao</p>
            </div>

            <form class="simple-form" id="contactForm" onsubmit="contact(); return false;">
                <label for="name">Your name</label>
                <input type="text" id="name" required>
                <label for="email">Your email</label>
                <input type="email" id="email" required>
                <label for="message">Your message</label>
                <textarea id="message" rows="5" required></textarea>
                <button class="button" type="submit">Send Message</button>
                <p class="form-message" id="contactMessage"></p>
            </form>

        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
